name: Deploy Mermaid Focus
on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mermaid-focus-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: de11927c1b728c9897c960abbe336098
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment secret
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret (Workers Scripts Edit on this account)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Deploy static assets to the existing Worker
        run: npx wrangler deploy
