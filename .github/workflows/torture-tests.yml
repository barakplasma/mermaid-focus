name: Directed graph torture tests

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "examples/**"
      - "tests/**"
      - ".github/workflows/torture-tests.yml"
  pull_request:
    paths:
      - "public/**"
      - "examples/**"
      - "tests/**"
      - ".github/workflows/torture-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
      - name: Test directed graph torture fixture
        run: python tests/torture_smoke.py
